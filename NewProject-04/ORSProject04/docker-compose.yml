version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: ORSProject04-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: p04
    ports:
      - "3308:3306"
    networks:
      - mynetwork
    volumes:
      - ./mysql-data:/var/lib/mysql

  webapp:
    build:
      context: .
    container_name: ORSProject04-webapp
    ports:
       - "8888:8888"  
    networks:
      - mynetwork
    depends_on:
      - mysql
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/p04
      
networks:
  mynetwork:
    driver: bridge